<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Cloud</title>
<style>
  :root { color-scheme: dark; --bg: #0d0d12; --panel: #17171f; --fg: #e6e6ea; --dim: #8a8a96; --accent: #c9a24a; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  [hidden] { display: none !important; }

  /* Before the game: what data this browser holds, and the choices. */
  #setup { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p { color: var(--dim); margin: 0 0 12px; }
  .card { background: var(--panel); border-radius: 8px; padding: 16px; margin: 16px 0; }
  .card h2 { font-size: 1rem; margin: 0 0 6px; color: var(--fg); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button, label.button { background: var(--accent); color: #111; border: 0; padding: 8px 14px; border-radius: 4px;
    font: inherit; cursor: pointer; display: inline-block; }
  button.secondary, label.secondary { background: #2a2a33; color: var(--fg); }
  input[type=file] { display: none; }
  progress { width: 100%; margin-top: 12px; }
  code { color: var(--fg); }

  /* The game: the whole window, the canvas scaled to fit. */
  #game { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; outline: none; }
  #toolbar { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; opacity: 0.35; transition: opacity 0.2s; }
  #toolbar:hover, #toolbar:focus-within { opacity: 1; }
  #toolbar button { background: rgba(30, 30, 40, 0.85); color: var(--fg); padding: 4px 10px; font-size: 13px; }
  #notice { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(20, 20, 28, 0.92);
    padding: 16px 20px; border-radius: 8px; min-width: min(360px, 80vw); text-align: center; }
  #notice progress { margin-top: 8px; }
  #drawer { position: absolute; left: 0; right: 0; bottom: 0; height: 40vh; background: rgba(0, 0, 0, 0.9); }
  #log { margin: 0; height: 100%; overflow: auto; padding: 8px 12px; box-sizing: border-box; color: #b8b8c0;
    font-size: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<main id="setup">
  <h1>Dark Cloud</h1>
  <p id="status">Starting…</p>

  <div id="pick" class="card" hidden>
    <h2>Game data</h2>
    <p>Use your own PAL disc of Dark Cloud. The data is copied into this browser's storage once and never leaves
      your computer.</p>
    <div class="row">
      <label class="button">Disc image (.iso) or data.zip<input id="file" type="file" accept=".iso,.zip"></label>
      <label class="button secondary">A folder<input id="folder" type="file" webkitdirectory></label>
    </div>
    <p style="margin-top: 12px">A folder can be the disc's files (<code>DATA.DAT</code> and <code>DATA.HD2</code>) or a
      <code>data</code> folder dcdata extracted. A disc is extracted when the game first starts.</p>
    <progress id="progress" hidden></progress>
  </div>

  <div id="ready" class="card" hidden>
    <h2 id="stored"></h2>
    <div class="row">
      <button id="start">Start</button>
      <button id="forget" class="secondary">Remove the game data</button>
    </div>
  </div>
</main>

<div id="game" hidden>
  <canvas id="canvas" tabindex="-1"></canvas>
  <div id="notice" hidden><div id="notice-text"></div><progress id="notice-progress" hidden></progress></div>
  <div id="toolbar">
    <button id="fullscreen" title="Fullscreen (F11 also works)">Fullscreen</button>
    <button id="log-toggle" title="Show what the game prints">Log</button>
  </div>
  <div id="drawer" hidden><pre id="log"></pre></div>
</div>
<script src="shell.js"></script>
</body>
</html>
