name: Commit notifications

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-26.04
    env:
      HAS_DISCORD: ${{ secrets.DISCORD_COMMITS_WEBHOOK_URL != '' }}
    steps:
      - name: Check out source
        if: env.HAS_DISCORD == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare commit message
        if: env.HAS_DISCORD == 'true'
        run: |
          python3 .github/scripts/discord_commits.py \
            --event "$GITHUB_EVENT_PATH" \
            "$RUNNER_TEMP/discord-commits.json"

      - name: Send commits to Discord
        if: env.HAS_DISCORD == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_COMMITS_WEBHOOK_URL }}
        run: |
          curl --fail-with-body --show-error --silent --retry 3 \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/discord-commits.json" \
            "$DISCORD_WEBHOOK_URL"
