# The browser build (PLATFORM WEB, docs/WEB.md): Emscripten, then the build log pushed to the ci-logs
# branch so it can be read with git alone. Each game link (Asyncify and wasm-opt over the whole game) takes about
# a quarter of an hour, so the WebGPU build (build) and the WebGL2 one (build-gl) link on runners of their own, side
# by side, and deploy puts the site together from both. Dark Chronicle (build-dc2) is a third, from another
# repository at a pinned commit, published under dc2/.
name: web

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.13
  # ccache keeps the compiled units between runs (actions/cache below); Emscripten runs its clang through it.
  EM_COMPILER_WRAPPER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_MAXSIZE: 1G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # The image's package lists are recent enough as a rule; updating them, slow when the mirror is, only if
      # the install fails without.
      - name: Install host tools
        run: |
          packages="ninja-build glslang-tools python3 ccache"
          sudo apt-get install -y --no-install-recommends $packages ||
            { sudo apt-get update && sudo apt-get install -y --no-install-recommends $packages; }

      # The SDK, with the libraries and ports Emscripten builds on first use in its cache directory.
      - name: Restore Emscripten
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('port/web/web.cmake') }}
          restore-keys: emsdk-${{ env.EMSDK_VERSION }}-

      - name: Install Emscripten
        run: |
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      # The animation editor's model converter (port/web/anim) builds Kazarov's Rust core for the browser: the
      # default toolchain, which Corrosion runs, and Kazarov's pinned one, which its folder selects, both need it.
      - name: Rust for the browser
        run: |
          rustup target add wasm32-unknown-emscripten
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-emscripten

      # A game link, Asyncify and wasm-opt over the whole game, outgrew the runner's memory once MoonMod was in it,
      # and the runner shut down mid-link even with one link at a time (web.cmake). Swap lets it finish, slower.
      - name: More swap for the game's link
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile > /dev/null
          sudo swapon /mnt/swapfile
          free -h

      # Saved under this run's key and restored from the newest, so each run starts from the last one's units.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-web-${{ github.run_id }}
          restore-keys: ccache-web-

      - name: Configure and build
        id: build
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          mkdir -p ci
          emcc --version | head -1 | tee ci/build.log
          set +e
          cmake --preset web -DDC_WEB_GL_IN_ALL=OFF 2>&1 | tee -a ci/build.log
          configure=${PIPESTATUS[0]}
          build=1
          if [ "$configure" -eq 0 ]; then
            # Keep going so one run reports every unit that fails.
            cmake --build --preset web -- -k 0 2>&1 | tee -a ci/build.log
            build=${PIPESTATUS[0]}
          fi
          echo "configure=$configure build=$build" | tee ci/status.txt
          ccache --show-stats >> ci/status.txt 2>&1 || true
          grep -E "error:|Error |undefined symbol|FAILED:|Wshift-count-overflow|Wbitfield-width|signature mismatch" ci/build.log | sort | uniq -c | sort -rn > ci/errors.txt || true
          ls -la port/build/web/darkcloud* >> ci/status.txt 2>&1 || true
          [ "$configure" -eq 0 ] && [ "$build" -eq 0 ]

      # No game data here, so this shows how far startup gets: the runtime, the fibers and the host setup.
      - name: Smoke run under Node
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          cd port/build/web
          mkdir -p smoke-save
          set +e
          timeout 180 node darkcloud.js --headless --offscreen --frames 30 --save smoke-save > ../../../ci/smoke.log 2>&1
          echo "exit=$?" >> ../../../ci/smoke.log
          cp darkcloud.js darkcloud.wasm darkcloud.data ../../../ci/

      # The page in headless Chromium from a plain static server, as GitHub Pages serves it: sw.js has to
      # isolate it, and the game has to read a data.zip the page stored in the browser's storage.
      - name: Smoke run in Chromium
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          cd port/build/web
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('smoke-data.zip', 'w') as archive:
              archive.writestr('data/smoke.txt', 'not the game data\n')
          PY
          (python3 -m http.server 8000 > /dev/null 2>&1 &)
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.63.0 > /dev/null
          # The runner already has Chromium's system libraries; apt-installing them took about nine minutes.
          # They are installed only if the browser cannot start without them.
          npx playwright install chromium > /dev/null
          node -e "require('playwright').chromium.launch().then((b) => b.close())" 2> /dev/null ||
            npx playwright install-deps chromium > /dev/null
          cp "$GITHUB_WORKSPACE/port/web/test/browser_smoke.mjs" .
          timeout 300 node browser_smoke.mjs http://localhost:8000/index.html /smoke-data.zip \
            "$GITHUB_WORKSPACE/ci/browser.log" --headless --offscreen --frames 30
          echo "exit=$?" >> "$GITHUB_WORKSPACE/ci/browser.log"
          # The WebGL2 build's run is build-gl's.

      # Kazarov's renderer tests against Vulkan on WebGPU and on WebGL2, built apart so their failures leave the
      # game's alone.
      - name: Build the renderer tests
        id: gfx_tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          set +e
          cmake --build --preset web --target kazarov_gfx_tests kazarov_gfx_tests_gl -- -k 0 > ci/gfx_tests_build.log 2>&1
          status=$?
          grep -E "error:|undefined symbol|FAILED:" ci/gfx_tests_build.log | sort | uniq -c | sort -rn > ci/gfx_tests_errors.txt
          exit $status

      - name: Renderer tests in Chromium
        if: steps.gfx_tests.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          cd "$RUNNER_TEMP/smoke"
          cp "$GITHUB_WORKSPACE/port/web/test/gfx_tests.mjs" .
          # Left out: main-depth copies, which Vulkan on WebGPU does not offer yet (CanCopyMainDepth is false and
          # the game falls back), and the two cases with vertices exactly on the eye plane, which SwiftShader's
          # clipper alone draws without them (docs/WEB.md).
          known="GfxGpuDepthCopy.*:GfxGpuMeshDc2.FogCrossingTheEyeBlendsClampedFog:GfxGpuMeshDc2.PlainFogCrossesTheEyeWithoutDividingByZero"
          timeout 900 node gfx_tests.mjs http://localhost:8000/gfx_tests.html "$GITHUB_WORKSPACE/ci/gfx_tests.log" \
            "--gtest_filter=-$known"
          echo "exit=$?" >> "$GITHUB_WORKSPACE/ci/gfx_tests.log"
          # Again as on Mali, the GPU cases only: no clip distances, and the layer's ways for Arm's GPUs.
          timeout 900 node gfx_tests.mjs http://localhost:8000/gfx_tests.html "$GITHUB_WORKSPACE/ci/gfx_tests_noclip.log" \
            "--gtest_filter=GfxGpu*-$known" --no-clip-distances --mali
          echo "exit=$?" >> "$GITHUB_WORKSPACE/ci/gfx_tests_noclip.log"
          # And on WebGL2, which Android's Mali GPUs run the game on.
          timeout 900 node gfx_tests.mjs "http://localhost:8000/gfx_tests.html?renderer=gl" \
            "$GITHUB_WORKSPACE/ci/gfx_tests_gl.log" "--gtest_filter=-$known"
          echo "exit=$?" >> "$GITHUB_WORKSPACE/ci/gfx_tests_gl.log"

      # The WebGPU probe in Chromium on SwiftShader: device, canvas, readback and fibers on the game's thread model.
      - name: WebGPU probe in Chromium
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          cd "$RUNNER_TEMP/smoke"
          cp "$GITHUB_WORKSPACE/port/web/test/probe.mjs" .
          timeout 300 node probe.mjs http://localhost:8000/probe.html "$GITHUB_WORKSPACE/ci/probe.log" \
            "$GITHUB_WORKSPACE/ci/probe"
          echo "exit=$?" >> "$GITHUB_WORKSPACE/ci/probe.log"
          cp "$GITHUB_WORKSPACE"/port/build/web/webgpu_probe.* "$GITHUB_WORKSPACE/ci/" 2>/dev/null

      - name: Publish the log to ci-logs
        if: always()
        run: |
          cd ci
          printf '%s %s\n' "${{ github.sha }}" "${{ steps.build.outcome }}" > commit.txt
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "web build log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      # The site: the page and the build, without the build directory's other files.
      - name: Assemble the site
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cd port/build/web
          cp -r anim mods ../../../site/
          cp index.html shell.js sw.js zip.js darkcloud.js darkcloud.wasm darkcloud.data probe.html \
            webgpu_probe.js webgpu_probe.wasm ../../../site/
          # The renderer tests too, for running on a device whose GPU draws wrong (gfx_tests.html).
          cp gfx_tests.html kazarov_gfx_tests.js kazarov_gfx_tests.wasm kazarov_gfx_tests_gl.js \
            kazarov_gfx_tests_gl.wasm ../../../site/ 2>/dev/null || true
          touch ../../../site/.nojekyll

      # The site without the WebGL2 build, which deploy adds from build-gl.
      - name: Upload the site
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-webgpu
          path: site
          include-hidden-files: true

      - name: Upload the build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: darkcloud-web
          path: |
            port/build/web/darkcloud.js
            port/build/web/darkcloud.wasm
            port/build/web/darkcloud.data
            port/build/web/index.html
            port/build/web/shell.js
            port/build/web/sw.js
            port/build/web/zip.js
            port/build/web/anim
            port/build/web/mods
            port/build/web/lang
            port/build/web/glyphs

  # The same game on WebGL2 (darkcloud_gl), which the page loads where WebGPU draws wrong or slowly: compiled from the
  # same cache and linked here while build links the WebGPU one.
  build-gl:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          packages="ninja-build glslang-tools python3 ccache"
          sudo apt-get install -y --no-install-recommends $packages ||
            { sudo apt-get update && sudo apt-get install -y --no-install-recommends $packages; }
      - name: Restore Emscripten
        uses: actions/cache/restore@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('port/web/web.cmake') }}
          restore-keys: emsdk-${{ env.EMSDK_VERSION }}-
      - name: Install Emscripten
        run: |
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
      - name: Rust for the browser
        run: |
          rustup target add wasm32-unknown-emscripten
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-emscripten
      - name: More swap for the game's link
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile > /dev/null
          sudo swapon /mnt/swapfile
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-web-gl-${{ github.run_id }}
          restore-keys: |
            ccache-web-gl-
            ccache-web-
      - name: Configure and build darkcloud_gl
        id: build
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          mkdir -p ci
          set -o pipefail
          cmake --preset web 2>&1 | tee ci/build_gl.log
          cmake --build --preset web --target darkcloud_gl 2>&1 | tee -a ci/build_gl.log
          ccache --show-stats || true
      - name: Smoke run in Chromium on WebGL2
        continue-on-error: true
        run: |
          set +e
          cd port/build/web
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('smoke-data.zip', 'w') as archive:
              archive.writestr('data/smoke.txt', 'not the game data\n')
          PY
          (python3 -m http.server 8000 > /dev/null 2>&1 &)
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.63.0 > /dev/null
          npx playwright install chromium > /dev/null
          node -e "require('playwright').chromium.launch().then((b) => b.close())" 2> /dev/null ||
            npx playwright install-deps chromium > /dev/null
          cp "$GITHUB_WORKSPACE/port/web/test/browser_smoke.mjs" .
          timeout 300 node browser_smoke.mjs "http://localhost:8000/index.html?renderer=gl" /smoke-data.zip \
            "$GITHUB_WORKSPACE/ci/browser_gl.log" --headless --offscreen --frames 30
          echo "exit=$?" >> "$GITHUB_WORKSPACE/ci/browser_gl.log"
          tail -20 "$GITHUB_WORKSPACE/ci/browser_gl.log"
      - name: Upload the WebGL2 build
        uses: actions/upload-artifact@v4
        with:
          name: darkcloud-web-gl
          path: |
            port/build/web/darkcloud_gl.js
            port/build/web/darkcloud_gl.wasm
            port/build/web/darkcloud_gl.data

  # Dark Chronicle's web build (ChronicleTwo, its docs/WEB.md), which the site offers beside Dark Cloud at dc2/. It
  # is built from the commit port/web/dc2.json pins and kept under that commit: a run that leaves the pin alone
  # takes the kept build in seconds, one that moves it compiles the game and links it twice (WebGPU and WebGL2),
  # an hour or more on a cold compiler cache. Only tracked files of that repository go into it, no game data.
  build-dc2:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Read the pin
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          pin = json.load(open('port/web/dc2.json'))
          assert re.fullmatch(r'[\w.-]+/[\w.-]+', pin['repository']), pin['repository']
          assert re.fullmatch(r'[0-9a-f]{40}', pin['commit']), pin['commit']
          print('repository=' + pin['repository'])
          print('commit=' + pin['commit'])
          PY
      - name: Restore the kept build
        id: kept
        uses: actions/cache@v4
        with:
          path: dc2-site
          key: dc2-site-${{ steps.pin.outputs.commit }}-emsdk-${{ env.EMSDK_VERSION }}
      - name: Check out Dark Chronicle
        if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: dc2
      - name: Install host tools
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          packages="ninja-build glslang-tools python3 ccache"
          sudo apt-get install -y --no-install-recommends $packages ||
            { sudo apt-get update && sudo apt-get install -y --no-install-recommends $packages; }
      - name: Restore Emscripten
        if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('port/web/web.cmake') }}
          restore-keys: emsdk-${{ env.EMSDK_VERSION }}-
      - name: Install Emscripten
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
      # Kazarov's Rust core there is built with a standard library of its own (threads in the browser), which
      # needs the toolchain's source; Corrosion runs the default toolchain, so the pinned one is made that.
      - name: Rust for the browser
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-emscripten --component rust-src
          rustup default 1.99.0
      - name: More swap for the game's link
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile > /dev/null
          sudo swapon /mnt/swapfile
      - name: Restore the compiler cache
        if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-dc2-${{ steps.pin.outputs.commit }}
          restore-keys: ccache-dc2-
      - name: Configure and build
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          mkdir -p ci
          set -o pipefail
          dc2/tools/web/build.sh configure 2>&1 | tee ci/build_dc2.log
          dc2/tools/web/build.sh build darkchronicle darkchronicle_gl 2>&1 | tee -a ci/build_dc2.log
          ccache --show-stats || true
          # The page and the two games, without the build directory's other files.
          mkdir -p dc2-site
          cd dc2/port/build/web
          cp index.html shell.js sw.js darkchronicle.js darkchronicle.wasm darkchronicle.data \
            darkchronicle_gl.js darkchronicle_gl.wasm darkchronicle_gl.data "$GITHUB_WORKSPACE/dc2-site/"
          ls -la "$GITHUB_WORKSPACE/dc2-site"
      # No game data here, so this shows how far startup gets, as Dark Cloud's does above.
      - name: Smoke run under Node
        if: steps.kept.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          dc2/tools/web/smoke.sh node --out "$GITHUB_WORKSPACE/ci/smoke-dc2" 2>&1 | tail -30
      - name: Upload the build log
        if: always() && steps.kept.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dc2-build-log
          path: ci
          if-no-files-found: ignore
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: dc2-web
          path: dc2-site
          if-no-files-found: error

  # Publishes main's build to GitHub Pages (jeffiest.github.io/DC_Web/). Pages' source must be GitHub Actions.
  # Every build has to pass: a failed one publishes nothing, and the site stays as it was.
  deploy:
    needs: [build, build-gl, build-dc2]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-webgpu
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: darkcloud-web-gl
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: dc2-web
          path: site/dc2
      # The row of games above each page's title (showGames in shell.js): a list beside each page, the hrefs from
      # that page's own folder.
      - name: List the games
        run: |
          printf '%s\n' '[{"name": "Dark Cloud", "href": "./"}, {"name": "Dark Chronicle", "href": "dc2/"}]' > site/games.json
          printf '%s\n' '[{"name": "Dark Cloud", "href": "../"}, {"name": "Dark Chronicle", "href": "./"}]' > site/dc2/games.json
          ls -la site site/dc2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
