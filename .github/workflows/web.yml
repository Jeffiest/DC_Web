# The browser build (PLATFORM WEB, docs/WEB.md): Emscripten, then the build log pushed to the ci-logs
# branch so it can be read with git alone.
name: web

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.13

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools python3

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Configure and build
        id: build
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          mkdir -p ci
          emcc --version | head -1 | tee ci/build.log
          set +e
          cmake --preset web 2>&1 | tee -a ci/build.log
          configure=${PIPESTATUS[0]}
          build=1
          if [ "$configure" -eq 0 ]; then
            # Keep going so one run reports every unit that fails.
            cmake --build --preset web -- -k 0 2>&1 | tee -a ci/build.log
            build=${PIPESTATUS[0]}
          fi
          echo "configure=$configure build=$build" | tee ci/status.txt
          grep -E "error:|Error |undefined symbol|FAILED:|Wshift-count-overflow|Wbitfield-width|signature mismatch" ci/build.log | sort | uniq -c | sort -rn > ci/errors.txt || true
          ls -la port/build/web/darkcloud* >> ci/status.txt 2>&1 || true
          [ "$configure" -eq 0 ] && [ "$build" -eq 0 ]

      # No game data here, so this shows how far startup gets: the runtime, the fibers and the host setup.
      - name: Smoke run under Node
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          cd port/build/web
          mkdir -p smoke-save
          set +e
          timeout 180 node darkcloud.js --headless --offscreen --frames 30 --save smoke-save > ../../../ci/smoke.log 2>&1
          echo "exit=$?" >> ../../../ci/smoke.log
          cp darkcloud.js darkcloud.wasm darkcloud.data ../../../ci/

      # The page in headless Chromium from a plain static server, as GitHub Pages serves it: sw.js has to
      # isolate it, and the game has to read a data.zip the page stored in the browser's storage.
      - name: Smoke run in Chromium
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          cd port/build/web
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('smoke-data.zip', 'w') as archive:
              archive.writestr('data/smoke.txt', 'not the game data\n')
          PY
          (python3 -m http.server 8000 > /dev/null 2>&1 &)
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.63.0 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          cp "$GITHUB_WORKSPACE/port/web/test/browser_smoke.mjs" .
          timeout 300 node browser_smoke.mjs http://localhost:8000/index.html /smoke-data.zip \
            "$GITHUB_WORKSPACE/ci/browser.log" --headless --offscreen --frames 30
          echo "exit=$?" >> "$GITHUB_WORKSPACE/ci/browser.log"

      # Kazarov's renderer tests against Vulkan on WebGPU, built apart so their failures leave the game's alone.
      - name: Build the renderer tests
        id: gfx_tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          set +e
          cmake --build --preset web --target kazarov_gfx_tests -- -k 0 > ci/gfx_tests_build.log 2>&1
          status=$?
          grep -E "error:|undefined symbol|FAILED:" ci/gfx_tests_build.log | sort | uniq -c | sort -rn > ci/gfx_tests_errors.txt
          exit $status

      - name: Renderer tests in Chromium
        if: steps.gfx_tests.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          cd "$RUNNER_TEMP/smoke"
          cp "$GITHUB_WORKSPACE/port/web/test/gfx_tests.mjs" .
          # Left out: main-depth copies, which Vulkan on WebGPU does not offer yet (CanCopyMainDepth is false and
          # the game falls back), and the two cases with vertices exactly on the eye plane, which SwiftShader's
          # clipper alone draws without them (docs/WEB.md).
          known="GfxGpuDepthCopy.*:GfxGpuMeshDc2.FogCrossingTheEyeBlendsClampedFog:GfxGpuMeshDc2.PlainFogCrossesTheEyeWithoutDividingByZero"
          timeout 900 node gfx_tests.mjs http://localhost:8000/gfx_tests.html "$GITHUB_WORKSPACE/ci/gfx_tests.log" \
            "--gtest_filter=-$known"
          echo "exit=$?" >> "$GITHUB_WORKSPACE/ci/gfx_tests.log"
          # Again on the fallback for adapters without clip distances (Mali, among others), the GPU cases only.
          timeout 900 node gfx_tests.mjs http://localhost:8000/gfx_tests.html "$GITHUB_WORKSPACE/ci/gfx_tests_noclip.log" \
            "--gtest_filter=GfxGpu*-$known" --no-clip-distances
          echo "exit=$?" >> "$GITHUB_WORKSPACE/ci/gfx_tests_noclip.log"

      # The WebGPU probe in Chromium on SwiftShader: device, canvas, readback and fibers on the game's thread model.
      - name: WebGPU probe in Chromium
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          cd "$RUNNER_TEMP/smoke"
          cp "$GITHUB_WORKSPACE/port/web/test/probe.mjs" .
          timeout 300 node probe.mjs http://localhost:8000/probe.html "$GITHUB_WORKSPACE/ci/probe.log" \
            "$GITHUB_WORKSPACE/ci/probe"
          echo "exit=$?" >> "$GITHUB_WORKSPACE/ci/probe.log"
          cp "$GITHUB_WORKSPACE"/port/build/web/webgpu_probe.* "$GITHUB_WORKSPACE/ci/" 2>/dev/null

      - name: Publish the log to ci-logs
        if: always()
        run: |
          cd ci
          printf '%s %s\n' "${{ github.sha }}" "${{ steps.build.outcome }}" > commit.txt
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "web build log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      # The site: the page and the build, without the build directory's other files.
      - name: Assemble the site
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cd port/build/web
          cp index.html shell.js sw.js darkcloud.js darkcloud.wasm darkcloud.data probe.html \
            webgpu_probe.js webgpu_probe.wasm ../../../site/
          touch ../../../site/.nojekyll

      - name: Upload the site for Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload the build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: darkcloud-web
          path: |
            port/build/web/darkcloud.js
            port/build/web/darkcloud.wasm
            port/build/web/darkcloud.data
            port/build/web/index.html
            port/build/web/shell.js
            port/build/web/sw.js
            port/build/web/lang
            port/build/web/glyphs

  # Publishes main's build to GitHub Pages (jeffiest.github.io/DC_Web/). Pages' source must be GitHub Actions.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
