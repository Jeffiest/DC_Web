# Keeps each of main's PC builds as the GitHub release build-<commit>: the Windows zip, the Linux Flatpak and the
# macOS archive that pc.yml and macos.yml make, which GitHub's artifacts would otherwise drop after 90 days. The
# page's PC downloads (site/mods/catalog.json) link a mod to the build it was confirmed with by that release.
#
# It runs when either workflow finishes a push to main. Once both have succeeded for the commit, whichever finished
# second publishes; a commit where one failed gets no release.
name: builds

on:
  workflow_run:
    workflows: ['PC builds', 'macOS build']
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Find both runs for the commit
        id: runs
        run: |
          runs=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA&event=push&per_page=50")
          for workflow in 'PC builds' 'macOS build'; do
            id=$(jq -r --arg name "$workflow" \
              '[.workflow_runs[] | select(.name == $name and .conclusion == "success")][0].id // empty' <<< "$runs")
            if [ -z "$id" ]; then
              echo "$workflow has not succeeded for $SHA yet; the release waits for it."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            key=$( [ "$workflow" = 'PC builds' ] && echo pc || echo macos )
            echo "$key=$id" >> "$GITHUB_OUTPUT"
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download the builds
        if: steps.runs.outputs.ready == 'true'
        run: |
          mkdir -p got out
          gh run download "${{ steps.runs.outputs.pc }}" -n chronicle-windows-x64 -D got/windows
          gh run download "${{ steps.runs.outputs.pc }}" -n chronicle-x86_64.flatpak -D got/flatpak
          gh run download "${{ steps.runs.outputs.macos }}" -n chronicle-macos-arm64 -D got/macos
          mv got/windows/*.zip out/darkcloud-windows-x64.zip
          mv got/flatpak/*.flatpak out/darkcloud-linux-x86_64.flatpak
          mv got/macos/*.tar.gz out/darkcloud-macos-arm64.tar.gz
          ls -l out

      - name: Publish build-${{ github.event.workflow_run.head_sha }}
        if: steps.runs.outputs.ready == 'true'
        run: |
          tag="build-${SHA:0:8}"
          cat > notes.md <<EOF
          Dark Cloud (Chronicle with MoonMod) built from $SHA on main.

          - **Windows:** \`darkcloud-windows-x64.zip\`. Unzip it and run \`darkcloud.exe\`.
          - **Linux:** \`darkcloud-linux-x86_64.flatpak\`. \`flatpak install --user darkcloud-linux-x86_64.flatpak\`.
          - **macOS (Apple silicon):** \`darkcloud-macos-arm64.tar.gz\`.

          The game data comes from your own disc (docs/PC.md). Mods go in \`save/mods/\`, one folder per mod.
          EOF
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --target "$SHA" --title "Build ${SHA:0:8}" --notes-file notes.md \
              --latest=false || gh release upload "$tag" out/* --clobber
          fi
